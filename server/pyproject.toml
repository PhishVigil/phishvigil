[project]
name = "phishvigil-server"
version = "0.1.0"
description = "Backend for PhishVigil"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "psycopg>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
