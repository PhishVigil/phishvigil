services:
  backend:
    build:
      context: .
      target: production
    ports:
     - "8000:8000"
  db:
    image: postgres:18.4-bookworm
    volumes: 
    - database:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}


volumes:
  database: