services:
  backend:
    build:
      context: .
      target: production
    ports:
     - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.4-bookworm
    volumes: 
    - database:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 3


volumes:
  database: